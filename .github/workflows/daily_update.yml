name: Daily Snowpack Update
on:
  schedule:
    - cron: "0 * * * *"   # Every hour
  workflow_dispatch:
concurrency:
  group: snowpack-update
  cancel-in-progress: false
jobs:
  update:
    name: Fetch · Analyze · Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true
      - name: Install CA certificates
        run: |
          sudo apt-get install -y ca-certificates
          sudo update-ca-certificates
          pip install certifi --break-system-packages
      - name: Write Earthdata netrc
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          echo "machine urs.earthdata.nasa.gov" > ~/.netrc
          echo "login ${EARTHDATA_USERNAME}" >> ~/.netrc
          echo "password ${EARTHDATA_PASSWORD}" >> ~/.netrc
          chmod 600 ~/.netrc
          echo "EARTHDATA_TOKEN=${EARTHDATA_TOKEN}" >> $GITHUB_ENV
      - name: Fetch SNOTEL
        # on failure, the last lines of output become an annotation (readable without log access)
        run: |
          pixi run fetch > fetch.log 2>&1 || { cat fetch.log; echo "::error title=fetch_snotel::$(tail -25 fetch.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1; }
          cat fetch.log
      - name: Fetch hourly temps
        run: pixi run fetch-hourly
        continue-on-error: true
      - name: Snow history + ENSO (rebuilds weekly, outlook every run)
        run: pixi run fetch-history
        continue-on-error: true
      - name: Fetch stream gauges
        env:
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
        run: pixi run fetch-gauges
        continue-on-error: true
      - name: Fetch MODIS snow cover
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: pixi run fetch-modis
        continue-on-error: true
      - name: Fetch Sentinel-2
        run: pixi run fetch-sentinel
        continue-on-error: true
      - name: R analysis
        run: pixi run analyze
        continue-on-error: true
      - name: Publish images
        # the page reads JSON/CSV straight from data/processed/; only images go in dashboard/
        run: |
          cp outputs/modis_snow_cover.png dashboard/ 2>/dev/null || true
      - name: Commit and push
        # Hourly runs, but commits every 3 hours unless the daily data moved or a river is rising fast —
        # every commit is kept in git forever, and most hours only the temperatures change.
        run: |
          git config user.name  "snowpack-bot[bot]"
          git config user.email "snowpack-bot@users.noreply.github.com"
          git add data/processed/ dashboard/ data/modis_archive/ data/sentinel_archive/ data/archive/
          if git diff --staged --quiet; then echo "nothing changed"; exit 0; fi
          HOUR=$(date -u +%H)
          DAILY=$(git diff --staged --name-only | grep -E 'snotel_daily|snow_history|modis_latest|sentinel_latest|archive/' || true)
          STORM=$(python3 -c "import json;g=json.load(open('data/processed/gauges_latest.json'))['gauges'];print(any(x.get('flood_alert') or ((x.get('change_24h') or 0)>0.5*max(1,(x.get('latest_cfs') or 0)-(x.get('change_24h') or 0))) for x in g))" 2>/dev/null || echo False)
          if [ $((10#$HOUR % 3)) -ne 0 ] && [ -z "$DAILY" ] && [ "$STORM" != "True" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "quiet hour — not committing (daily files unchanged, rivers steady)"; exit 0
          fi
          git commit -m "data: update $(date -u +%Y-%m-%dT%H:%M)Z"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
