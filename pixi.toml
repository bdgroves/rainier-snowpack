[workspace]
name = "rainier-snowpack"
version = "0.1.0"
description = "Mt. Rainier snowpack monitoring"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[tasks]
fetch          = "python src/python/fetch_snotel.py"
fetch-hourly   = "python src/python/fetch_hourly.py"
fetch-gauges   = "python src/python/fetch_gauges.py"
fetch-modis    = "python src/python/fetch_modis.py"
fetch-sentinel = "python src/python/fetch_sentinel.py"
fetch-history  = "python src/python/fetch_history.py"
analyze        = "Rscript src/r/snowpack_stats.R"
update         = { depends-on = ["fetch", "fetch-hourly", "fetch-history", "fetch-gauges", "fetch-modis", "fetch-sentinel", "analyze"] }

[dependencies]
python        = "3.12.*"
pandas        = ">=2.2"
httpx         = ">=0.27"
requests      = ">=2.31"
geopandas     = ">=0.14"
rioxarray     = ">=0.15"
xarray        = ">=2024.1"
matplotlib    = ">=3.8"
plotly        = ">=5.20"
jinja2        = ">=3.1"
earthaccess   = ">=0.9"
libgdal-hdf4  = ">=3.8"
r-base        = ">=4.3"
r-tidyverse   = ">=2.0"
r-sf          = ">=1.0"
r-zoo         = ">=1.8"
r-jsonlite    = ">=1.8"
